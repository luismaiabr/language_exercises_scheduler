[project]
name = "language-exercises-scheduler"
version = "0.1.0"
description = "Automated SMTP email scheduler for German micro-lessons and interactive magic links"
authors = [{ name = "Luis Maia" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "supabase>=2.4.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "fastapi (>=0.162.0,<0.163.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.poetry]
packages = [{include = "app"}]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
