scheduler:
  poll_interval_seconds: 60
  batch_size: 25
  max_retries: 3
  retry_backoff_seconds: 5
  timespan_window_hours: 24

smtp:
  host: "smtp.hostinger.com"
  port: 587
  user: "education@xseed.space"
  from_email: "education@xseed.space"
  from_name: "🇩🇪 Deutsch Daily"
  use_tls: true
  use_ssl: false
  timeout_seconds: 15

email_styling:
  brand_name: "Deutsch Daily"
  primary_color: "#00E5FF"
  background_color: "#0A0A0A"
  card_color: "#141414"
  text_color: "#F5F5F5"
  muted_color: "#A3A3A3"
